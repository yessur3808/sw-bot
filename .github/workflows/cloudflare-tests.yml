name: Cloudflare worker tests
on:
  push:
    paths: ['workers/free/**', '.github/workflows/cloudflare-tests.yml']
  pull_request:
    paths: ['workers/free/**', '.github/workflows/cloudflare-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test workers/free/tests/*.test.mjs
